<!DOCTYPE html>
<!--
  index.html — sketch-level host page for the Eden web port (Stage P2+, per
  web-port-plan.md deliverable 6 "Sketch-level is fine; label TODOs").

  Per plan decision D1 (run the engine in a Web Worker + OffscreenCanvas + PROXY_TO_PTHREAD),
  this page's only real job is:
    1. host the visible <canvas>,
    2. transfer control of it to a worker via canvas.transferControlToOffscreen(),
    3. start the worker (worker-bootstrap.js) and hand it the OffscreenCanvas + the module URL,
    4. forward DOM lifecycle events (visibilitychange/pagehide — Stage P7, the C1 audit fix)
       and Pointer Events (Stage P3 input) to the worker via postMessage.
  None of steps 2-4 are implemented yet — this file is TODO-marked scaffolding, written before
  emsdk is even installed on this machine (see docs/PORT-STATUS.md), not a working page.

  HOSTING REQUIREMENT (plan D1): SharedArrayBuffer (needed for PROXY_TO_PTHREAD's real
  pthreads) requires the page be served with:
    Cross-Origin-Opener-Policy: same-origin
    Cross-Origin-Embedder-Policy: require-corp
  A plain `python3 -m http.server` / most static hosts do NOT send these by default — see
  web/cmake/README.md "Hosting requirement" for the dev-server flag and a same-origin
  service-worker fallback (the "coi-serviceworker" pattern) for hosts that can't set headers.
-->
